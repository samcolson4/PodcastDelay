services:
  podcastdelay:
    image: ghcr.io/samcolson4/podcastdelay:latest
    restart: unless-stopped
    ports:
      - "${PODCASTDELAY_PORT:-8080}:8080"
    volumes:
      - podcastdelay-data:/data
    environment:
      PODCASTDELAY_BASE_URL: ${PODCASTDELAY_BASE_URL:-https://podcasts.example.com}
      PODCASTDELAY_ADMIN_USER: ${PODCASTDELAY_ADMIN_USER:-admin}
      PODCASTDELAY_ADMIN_PASSWORD: ${PODCASTDELAY_ADMIN_PASSWORD:?set PODCASTDELAY_ADMIN_PASSWORD in .env}
      PODCASTDELAY_DEFAULT_TIMEZONE: ${PODCASTDELAY_DEFAULT_TIMEZONE:-UTC}
    healthcheck:
      test: ["CMD", "/podcastdelay", "healthcheck"]
      interval: 60s

volumes:
  podcastdelay-data:
