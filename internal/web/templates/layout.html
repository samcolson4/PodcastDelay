{{define "header"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.}} — PodcastDelay.</title>
<script>
// Apply the saved theme before first paint (no flash). No saved value = auto (follow the system).
try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="site-header"><div class="container">
<nav class="top">
  <ul><li><a class="brand" href="/admin"><span><span class="brand-podcast">Podcast</span><span class="brand-delay">Delay.</span></span></a></li></ul>
  <ul><li>
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <button type="button" data-theme-value="auto" title="Auto (follow system)" aria-label="Auto theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
      <button type="button" data-theme-value="light" title="Light" aria-label="Light theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-theme-value="dark" title="Dark" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </li></ul>
</nav>
</div></header>
<main class="container">
{{end}}

{{define "footer"}}
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/htmx.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
